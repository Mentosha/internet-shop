networks:
  analytics_net:

services:

  postgres:
    image: postgres:15-alpine
    container_name: internet-shop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - analytics_net
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  redash:
    image: redash/redash:latest
    container_name: internet-shop-redash
    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
    ports:
      - "5000:5000"
    networks:
      - analytics_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  redash-worker:
    image: redash/redash:latest
    container_name: internet-shop-redash-worker
    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
    networks:
      - analytics_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    command: worker

  generator:
    build:
      context: ./generate
    container_name: internet-shop-generator
    networks:
      - analytics_net
    depends_on:
      - postgres
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: internet-shop-jupyter
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./notebooks:/home/jovyan/work
    ports:
      - "8888:8888"
    networks:
      - analytics_net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/lab"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
