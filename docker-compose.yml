services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  postgres_redash:
    image: postgres:15-alpine
    container_name: shop_postgres_redash
    environment:
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: redash123
      POSTGRES_DB: redash
    volumes:
      - postgres_redash_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redash -d redash"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  redash:
    image: redash/redash:latest
    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      postgres_redash:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: server

  redash-worker:
    image: redash/redash:latest
    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres_redash:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: worker

  generator:
    build:
      context: ./generate
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    env_file:
      - .env

  jupyter:
    image: jupyter/scipy-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./notebooks:/home/jovyan/work
    ports:
      - "8888:8888"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8888/lab || exit 1"]
      interval: 10s
      retries: 5
    env_file:
      - .env

volumes:
  pgdata:
  postgres_redash_data: