networks:
  analytics_net:

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - analytics_net
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7
    restart: always
    networks:
      - analytics_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
  redash:
    image: redash/redash:latest
    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    networks:
      - analytics_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    command: server

  redash-worker:
    image: redash/redash:latest
    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_REDIS_URL: redis://redis:6379/0
    networks:
      - analytics_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    command: worker

  generator:
    build:
      context: ./generate
    networks:
      - analytics_net
    depends_on:
      - postgres
    restart: always
    env_file:
    - .env


  jupyter:
    image: jupyter/scipy-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./notebooks:/home/jovyan/work
    ports:
      - "8888:8888"
    networks:
      - analytics_net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/lab"]
      interval: 10s
      retries: 5
    env_file:
    - .env

volumes:
  pgdata:
